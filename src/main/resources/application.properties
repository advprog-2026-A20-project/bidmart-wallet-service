spring.application.name=wallet-service
server.port=${PORT:8084}

security.jwt.secret=${JWT_SECRET:local-dev-secret-please-change-32-chars}
security.jwt.expiration-seconds=${JWT_EXP_SECONDS:604800}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.datasource.url=${WALLET_DB_URL:${DATABASE_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:wallet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}}
spring.datasource.username=${WALLET_DB_USERNAME:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}}
spring.datasource.password=${WALLET_DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=${WALLET_DB_DRIVER_CLASS_NAME:${DATABASE_DRIVER_CLASS_NAME:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}}}
spring.jpa.hibernate.ddl-auto=${WALLET_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

internal.service-token=${INTERNAL_SERVICE_TOKEN:}
management.endpoint.health.show-details=never
