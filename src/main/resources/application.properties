spring.application.name=wallet-service
server.port=${PORT:8085}

security.jwt.secret=${JWT_SECRET:local-dev-secret-please-change-32-chars}
security.jwt.expiration-seconds=${JWT_EXP_SECONDS:604800}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.datasource.url=${WALLET_DB_URL:jdbc:h2:mem:wallet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${WALLET_DB_USERNAME:sa}
spring.datasource.password=${WALLET_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${WALLET_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

internal.service-token=${INTERNAL_SERVICE_TOKEN:}
management.endpoint.health.show-details=never
